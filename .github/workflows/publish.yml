name: Publish to npm

# Publishes @andyfooblah/voice-common via npm Trusted Publishing (OIDC).
# No npm token is stored anywhere: GitHub mints a short-lived OIDC token for
# this workflow run and npm exchanges it for publish rights, provided the
# package's Trusted Publisher on npmjs.com is configured for
#   owner AndyFooBlah / repo VoiceCommon / workflow publish.yml.
# See README.md → "Releasing" for the one-time npmjs.com setup.

# One trigger only: publishing a GitHub Release whose tag is vX.Y.Z (the
# release creates the tag). A bare `git push --tags` no longer publishes.
# Re-running a release whose version is already on npm is a green no-op.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC Trusted Publishing + provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x; Trusted Publishing needs npm >= 11.5.1.
      # npm 12 requires Node >= 22.22.2, so stay on the 11.x line explicitly.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Build library
        run: npm run build:lib

      - name: Verify release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # A re-run (or a release created after a manual publish) must not go
      # red on "cannot publish over the previously published versions".
      - name: Skip if this version is already on npm
        id: registry
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if PUBLISHED="$(npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null)" && [ -n "$PUBLISHED" ]; then
            echo "::notice::$PKG_NAME@$PKG_VERSION is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Intentionally no NODE_AUTH_TOKEN: authentication is the OIDC token.
      - name: Publish
        if: steps.registry.outputs.publish == 'true'
        run: npm publish --provenance --access public
