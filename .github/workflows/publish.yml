name: Publish to npm

# Publishes @andyfooblah/voice-common via npm Trusted Publishing (OIDC).
# No npm token is stored anywhere: GitHub mints a short-lived OIDC token for
# this workflow run and npm exchanges it for publish rights, provided the
# package's Trusted Publisher on npmjs.com is configured for
#   owner AndyFooBlah / repo VoiceCommon / workflow publish.yml.
# See README.md → "Releasing" for the one-time npmjs.com setup.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC Trusted Publishing + provenance

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x; Trusted Publishing needs npm >= 11.5.1.
      # npm 12 requires Node >= 22.22.2, so stay on the 11.x line explicitly.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Build library
        run: npm run build:lib

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Intentionally no NODE_AUTH_TOKEN: authentication is the OIDC token.
      - name: Publish
        run: npm publish --provenance --access public
